# Driver tuning for the Snapmaker U1's TMC2240 X and Y steppers.
#
# The 38 driver_ parameter values below are not Bespok3d's. They reached the U1 community through the
# Extended Firmware overlay 32-feature-klipper-tweaks, file tweaks/klipper/tmc_autotune.cfg, added by
# paxx12 on 2026-02-01; that file's own header records their origin as
# https://github.com/Argolein/SnapmakerU1/blob/main/SnapmakerU1-CustomConfig/01_ArgoConfig.cfg.
# They are reproduced unchanged because they are what this tuning is: different values would be a
# different plugin.
#
# The text of this file, its comments, its ordering and its grouping, was written by the Bespok3d
# project on 2026-07-28 against the TMC2240 register field names as Klipper documents them
# (Configuration Reference, "[tmc2240]", the driver_XXX fields). No line of the overlay file is copied
# here. Each field below is a TMC2240 register field that Klipper writes at driver init.
#
# Safety: these are low level driver registers. Wrong values here can overheat a motor, degrade print
# quality or stall an axis. Watch stepper temperatures over the first few prints after enabling this.

[tmc2240 stepper_x]
# SpreadCycle chopper: slow decay time, hysteresis start and end, comparator blank time.
driver_TOFF: 5
driver_HSTRT: 7
driver_HEND: 9
driver_TBL: 1
driver_TPFD: 2
# StealthChop: let the driver find its own amplitude and gradient, seeded from these offsets.
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_OFS: 22
driver_PWM_GRAD: 13
driver_PWM_REG: 15
driver_PWM_LIM: 4
# CoolStep load based current control: when to step current down, by how much, and the floor.
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
# Current ramp timing and microstep filtering.
driver_IHOLDDELAY: 12
driver_IRUNDELAY: 0
driver_MULTISTEP_FILT: True

[tmc2240 stepper_y]
# Same tuning as X: the two axes carry the same motor and the same load.
driver_TOFF: 5
driver_HSTRT: 7
driver_HEND: 9
driver_TBL: 1
driver_TPFD: 2
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_OFS: 22
driver_PWM_GRAD: 13
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_IHOLDDELAY: 12
driver_IRUNDELAY: 0
driver_MULTISTEP_FILT: True
